let selected = [];

function toggleSpice(id) {
  selected = selected.includes(id) ? selected.filter((x) => x !== id) : [...selected, id];
  render();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function getSelectedSpices() {
  return SPICES.filter((s) => selected.includes(s.id));
}

function getFoodCounts(selSpices) {
  const counts = {};
  selSpices.forEach((s) => s.foods.forEach((f) => (counts[f] = (counts[f] || 0) + 1)));
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function getMatchedCombos() {
  return COMBOS.filter((c) => c.ids.every((id) => selected.includes(id)));
}

function getRecommendedSet() {
  if (selected.length === 0) return null;
  const scored = SETS.map((set) => ({
    set,
    score: set.matches.filter((id) => selected.includes(id)).length,
  })).sort((a, b) => b.score - a.score);
  return scored[0].score > 0 ? scored[0] : null;
}

function byCategory() {
  const map = {};
  Object.keys(CATEGORIES).forEach((k) => (map[k] = []));
  SPICES.forEach((s) => map[s.category].push(s));
  return map;
}

const CHECK_SVG =
  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
const X_SVG =
  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

function renderPicker() {
  const cats = byCategory();
  let html = "";
  Object.entries(CATEGORIES).forEach(([catId, cat]) => {
    html += `<div class="cat-group">
      <h2 class="cat-label" style="color:${cat.color}">${esc(cat.label)}</h2>
      <div class="chip-row">`;
    cats[catId].forEach((spice) => {
      const isSel = selected.includes(spice.id);
      html += `<button class="chip" data-id="${spice.id}" onclick="toggleSpice('${spice.id}')"
        style="background:${isSel ? cat.color : "rgba(244,233,216,0.05)"};
               color:${isSel ? "#1E140D" : "#F4E9D8"};
               border-left:3px solid ${cat.color};
               font-weight:${isSel ? 600 : 400};">
        ${esc(spice.name)}${isSel ? `<span class="chip-check">${CHECK_SVG}</span>` : ""}
      </button>`;
    });
    html += `</div></div>`;
  });
  return html;
}

function renderResults() {
  const selSpices = getSelectedSpices();
  if (selSpices.length === 0) {
    return `<div class="empty-state">Тут з'явиться список продуктів і страв, щойно ви оберете хоча б одну спецію.</div>`;
  }

  const foodCounts = getFoodCounts(selSpices);
  const matchedCombos = getMatchedCombos();

  let html = `<div class="selected-summary">`;
  selSpices.forEach((s) => {
    html += `<span class="selected-tag">${esc(s.name)}
      <button onclick="toggleSpice('${s.id}')" class="remove-btn">${X_SVG}</button>
    </span>`;
  });
  html += `</div>`;

  html += `<section><h2 class="section-title">Продукти, що пасують</h2><div class="chip-row">`;
  foodCounts.forEach(([food, count]) => {
    html += `<span class="tag-chip ${count >= 2 ? "tag-chip-hi" : ""}">${esc(food)}${
      count >= 2 ? ` <span class="tag-count">×${count}</span>` : ""
    }</span>`;
  });
  html += `</div>`;
  if (foodCounts.some(([, c]) => c >= 2)) {
    html += `<p class="hint-text">Позначка ×2 і більше означає, що продукт підходить одразу до кількох обраних спецій.</p>`;
  }
  html += `</section>`;

  if (matchedCombos.length > 0) {
    html += `<section><h2 class="section-title">✨ Ваше поєднання особливо підходить для</h2><div class="combo-list">`;
    matchedCombos.forEach((combo) => {
      html += `<div class="combo-card">
        <p class="combo-title">${esc(combo.title)}</p>
        <ul class="dish-list">`;
      combo.dishes.forEach((d) => {
        html += `<li><span class="dish-name">${esc(d.name)}</span> <span class="dish-note">— ${esc(d.note)}</span></li>`;
      });
      html += `</ul></div>`;
    });
    html += `</div></section>`;
  }

  html += `<section><h2 class="section-title">🍲 Страви для кожної спеції</h2><div class="per-spice-list">`;
  selSpices.forEach((s) => {
    html += `<div class="per-spice-block">
      <p class="per-spice-name" style="color:${CATEGORIES[s.category].color}">${esc(s.name)}</p>
      <ul class="dish-list">`;
    s.dishes.forEach((d) => {
      html += `<li><span class="dish-name">${esc(d.name)}</span> <span class="dish-note-muted">— ${esc(d.note)}</span></li>`;
    });
    html += `</ul></div>`;
  });
  html += `</div></section>`;

  return html;
}

function renderRecommendedSet() {
  const rec = getRecommendedSet();
  if (!rec) return "";
  const set = rec.set;
  return `<section class="rec-set" style="border:1px solid ${set.accent}55">
    <div class="rec-set-inner">
      <div class="rec-set-image" style="background:${set.accent}22">
        <img src="${set.image}" alt="${esc(set.name)}" />
      </div>
      <div class="rec-set-body">
        <p class="rec-set-label">Радимо набір «Присмак»</p>
        <h2 class="rec-set-name" style="color:${set.accent}">${esc(set.name)}</h2>
        <p class="rec-set-tagline">${esc(set.tagline)}</p>
        <div class="chip-row">
          ${set.contents.map((item) => `<span class="content-chip">${esc(item)}</span>`).join("")}
        </div>
      </div>
    </div>
  </section>`;
}

function render() {
  document.getElementById("picker").innerHTML = renderPicker();
  document.getElementById("results").innerHTML = renderResults();
  document.getElementById("rec-set-slot").innerHTML = renderRecommendedSet();
}

render();

</script>
</body>
</html>
